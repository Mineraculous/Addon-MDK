name: build

on:
  push:
    branches:
      - main
      - '1.**'
  pull_request:
  workflow_call:
    inputs:
      artifact-name:
        description: "Name of the artifact to upload"
        required: false
        type: string
        default: "Addon-MDK"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    uses: Mineraculous/.github/.github/workflows/build.yml@main
    secrets: inherit
    with:
      artifact-name: ${{ inputs.artifact-name || 'Addon-MDK' }}
