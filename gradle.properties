# ==============================================================================
# Project Properties
# ==============================================================================
# The version of your addon. Semantic versioning (e.g., 1.0.0) is recommended.
version=1.0.0
# Your maven group ID (typically reversed domain name, e.g., com.yourname.yourmod)
group=com.example.exampleaddon

# ==============================================================================
# Mod Metadata & Options
# ==============================================================================
# The unique identifier for your mod. Must be all lowercase alphanumeric/underscores.
mod_id=exampleaddon
# The display name of your mod as shown in the in-game mod list.
mod_name=Example Addon
# The author(s) of the mod.
mod_author=Example
# A summary description of your addon's features.
description=An example addon for the Mineraculous mod
# The license under which your mod is released (e.g., MIT, All Rights Reserved)
license=All Rights Reserved
# The filename of your mod icon (located in src/main/resources/)
icon=icon.png

# ==============================================================================
# Game & Loader Versions
# ==============================================================================
# The Minecraft version this mod is built for.
minecraft_version=1.21.1
# Java target version (Minecraft 1.21+ requires Java 21)
java_version=21
# The version of NeoForge to compile and run against.
neoforge_version=21.1.264
# The major FML loader version required by NeoForge.
major_fml_version=4

# ==============================================================================
# Parchment Mappings
# ==============================================================================
# Parchment provides parameter names and javadocs mapped onto official Mojang names.
# Mappings version corresponds to the snapshot date (YYYY.MM.DD).
# Note: The Minecraft version for Parchment defaults to 'minecraft_version'.
parchment_version=2024.11.17

# ==============================================================================
# Required Dependencies
# ==============================================================================
# TommyLib is the core library required by Mineraculous and its addons.
tommylib_version=36.1.0

# NOTE TO ADDON DEVELOPERS:
# If 'mineraculous_version' is set to a beta build, you must be an authorized
# beta tester and uncomment the 'Mineraculous Betas' repository block in your
# build.gradle file to successfully compile.
# Once a stable version is released publicly, this can be built with no setup.
mineraculous_version=1.0.0-beta16

# ==============================================================================
# Optional Integration Dependencies
# ==============================================================================
# Curios is strongly recommended if your addon adds custom Miraculouses or jewelry.
curios_version=9.5.1+1.21.1
# SmartBrainLib is useful for advanced AI behaviors and custom entities.
smartbrainlib_version=1.16.11
# Modonomicon is used for creating in-game guide books.
modonomicon_version=1.120.7

# ==============================================================================
# Runtime Quality-of-Life Dependencies
# ==============================================================================
# Jade provides in-game tooltips.
jade_version=15.10.6
# JEI provides in-game recipe information.
jei_version=19.64.0.455

# ==============================================================================
# Publishing Metadata
# ==============================================================================
# See full common.gradle documentation at:
# https://github.com/Mineraculous/.github/tree/main/gradle
#
# Your GitHub repository name (defaults to sanitized mod_name if omitted).
# github_name=Example-Addon
#
# Your GitHub username or organization (used for Maven POM issue tracker and SCM links).
# github_owner=your-github-username
#
# Target Maven repository to publish your addon artifacts to (via ./gradlew publish).
# maven_url=https://maven.yourdomain.com/releases

# ==============================================================================
# Toolchain Dependencies
# ==============================================================================
# Foojay Toolchains Plugin for auto-provisioning the Microsoft OpenJDK.
foojay_version=1.0.0
# Code formatting and verification plugin (Spotless engine).
immaculate_version=0.2.5
# NeoForge ModDevGradle plugin for Minecraft development.
mdg_version=2.0.148

# ==============================================================================
# Gradle
# ==============================================================================
org.gradle.jvmargs=-Xmx4G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
